[paths]
train = "corpus/train.spacy"
dev   = "corpus/valid.spacy"

[system]
gpu_allocator = null

[nlp]
lang = "en"
pipeline = ["tok2vec","ner"]

[components]

[components.tok2vec]
source = "output_frozen/model-best"
component = "tok2vec"

[components.ner]
source = "output_frozen/model-best"
component = "ner"

[training]
dev_corpus = "corpora.dev"
train_corpus = "corpora.train"
max_epochs = 0
patience = 1600
max_steps = 8000
eval_frequency = 50
seed = 42
accumulate_gradient = 1
frozen_components = []
annotating_components = []

[training.optimizer]
@optimizers = "Adam.v1"
learn_rate = 0.0001

[training.batcher]
@batchers = "spacy.batch_by_words.v1"
size = 500
tolerance = 0.2
discard_oversize = false

[corpora]

[corpora.train]
@readers = "spacy.Corpus.v1"
path = ${paths.train}
max_length = 0

[corpora.dev]
@readers = "spacy.Corpus.v1"
path = ${paths.dev}
max_length = 0

[initialize]
vectors = "en_core_web_lg"
